<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .game-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            color: #673ab7;
            margin-bottom: 12px;
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #764ba2;
            border-radius: 12px;
            font-size: 20px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }

        button:hover {
            opacity: 0.88;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .new-game {
            background: #ff9800;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 28px;
        }

        .attempts {
            margin-top: 18px;
            color: #555;
            font-size: 17px;
        }

        .range {
            background: #f1eaff;
            padding: 12px;
            border-radius: 10px;
            color: #673ab7;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="game-box">

        <div class="emoji">🎯</div>

        <h1>Number Guessing Game</h1>

        <p class="description">
            Welcome to the game!<br>
            Guess a secret number between 1 and 100.
        </p>

        <div class="range">
            🔢 Enter your number between 1 - 100
        </div>

        <input
            type="number"
            id="guess"
            placeholder="Enter your guess"
            min="1"
            max="100"
        >

        <button id="guessButton" onclick="checkGuess()">
            Submit Guess 🚀
        </button>

        <button class="new-game" onclick="startGame()">
            New Game 🔄
        </button>

        <p id="message">Click New Game to start!</p>

        <p class="attempts">
            Attempts: <span id="attempts">0</span>
        </p>

    </div>

    <script>

        let gameId = null;

        async function startGame() {

            const message = document.getElementById("message");

            try {
                const response = await fetch("/api/game/start", {
                    method: "POST"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error("Unable to start game");
                }

                gameId = data.gameId;

                document.getElementById("guess").value = "";
                document.getElementById("attempts").textContent = "0";

                document.getElementById("guess").disabled = false;
                document.getElementById("guessButton").disabled = false;

                message.textContent = "New game started! Good luck! 🎮";

            } catch (error) {
                message.textContent = "Server error! Please try again.";
            }
        }

        async function checkGuess() {

            const guess = Number(document.getElementById("guess").value);
            const message = document.getElementById("message");

            if (!gameId) {
                message.textContent = "Please start a new game first!";
                return;
            }

            if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
                message.textContent = "Enter a valid number between 1 and 100!";
                return;
            }

            try {

                const response = await fetch("/api/game/guess", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        gameId: gameId,
                        guess: guess
                    })
                });

                const data = await response.json();

                message.textContent = data.message;

                document.getElementById("attempts").textContent =
                    data.attempts;

                if (data.status === "WON") {
                    message.textContent = "🎉 Congratulations! You Won!";
                    document.getElementById("guess").disabled = true;
                    document.getElementById("guessButton").disabled = true;
                }

            } catch (error) {
                message.textContent = "Unable to connect to Java server!";
            }
        }

    </script>

</body>
</html>
